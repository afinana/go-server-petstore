version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: petstore-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - petstore-network

  petstore-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petstore-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDR: "0.0.0.0:8080"
      DATABASE_URI: "mongodb://mongodb:27017"
      DATABASE_NAME: "petstore"
      ENABLE_AUTH_VALIDATION: "true"
      GATEWAY_SECRET: "internal-dev-secret"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - petstore-network

volumes:
  mongo_data:
    driver: local

networks:
  petstore-network:
    driver: bridge
